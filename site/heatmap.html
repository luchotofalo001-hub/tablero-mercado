<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heatmap · Tablero de Mercado</title><link rel="stylesheet" href="style.css"></head>
<body><div id="lluvia" aria-hidden="true"></div><div class="cinta"><div id="cinta"></div></div>
<main class="app wide"><header class="top"><h1>Heatmap</h1><nav class="nav"><a href="./">Dashboard</a><a class="on" href="heatmap.html">Heatmap</a></nav><button id="tema" aria-label="Cambiar tema">◐</button></header>
<p class="sub" id="act">Cargando…</p><p class="help" style="text-align:center">Tamaño = valor de la empresa · Color = variación de hoy. Agrupado por sector.</p>
<div id="heat" class="heat"></div><div id="tip" class="tip"></div></main>
<script src="comun.js"></script><script>
cargar(d=>{const el=$('#heat'),W=el.clientWidth,Hh=Math.max(520,Math.round(W*1.1));el.style.height=Hh+'px';
const by={};d.acciones.forEach(a=>{if(a.cap>0)(by[a.sec]=by[a.sec]||[]).push({...a,v:a.cap})});
const secs=Object.entries(by).map(([k,v])=>({k,v:v.reduce((s,a)=>s+a.v,0),items:v.sort((a,b)=>b.v-a.v)})).sort((a,b)=>b.v-a.v);
let h='';squarify(secs,0,0,W,Hh).forEach(s=>{h+=`<div class="hs" style="left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px"><b>${s.k}</b></div>`;
squarify(s.items,s.x+1,s.y+16,s.w-2,s.h-17).forEach(a=>{const c=a.chg||0,al=Math.min(1,Math.abs(c)/3);
h+=`<div class="hc" data-t="${a.t}" style="left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px;background:${c>=0?`rgba(34,197,94,${.25+al*.75})`:`rgba(239,68,68,${.25+al*.75})`}">${a.w>34&&a.h>22?`<span>${a.t}<br>${pm(c)}</span>`:''}</div>`})});
el.innerHTML=h;el.onclick=e=>{const t=e.target.closest('.hc')?.dataset.t;if(!t)return;const a=d.acciones.find(x=>x.t===t);$('#tip').innerHTML=`<b>${t}</b> ${a.n} · ${a.sec}<br>US$ ${f(a.p)} · ${pm(a.chg)} · Score ${f(a.s,0)} · RS ${a.rs}`}});
</script></body></html>
